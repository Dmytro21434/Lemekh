<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Практичне заняття №2 | Основи CSS</title>
    <!-- Підключення зовнішнього CSS-файлу -->
    <link rel="stylesheet" href="style2.css">
</head>
<body>

    <header>
        <h1>Практичне заняття №2. Основи CSS</h1>
        <p><a href="../index.html#practices">← Повернутися до списку практичних</a></p>
    </header>

    <main>
        <!-- Форма зі стилізованими класами -->
        <form class="custom-form" action="https://webhook.site/a007de40-2ad4-4a26-bece-c7ca98b0a97b" method="POST">
            <h2>Реєстрація користувача</h2>
            
            <div class="form-group">
                <label for="first-name">Ім'я: *</label>
                <input type="text" id="first-name" name="first_name" required placeholder="Введіть ім'я">
            </div>

            <div class="form-group">
                <label for="last-name">Прізвище: *</label>
                <input type="text" id="last-name" name="last_name" required placeholder="Введіть прізвище">
            </div>

            <div class="form-group">
                <label for="user-email">Електронна пошта: *</label>
                <input type="email" id="user-email" name="user_email" required placeholder="example@mail.com">
            </div>

            <div class="form-group">
                <label for="user-password">Пароль: *</label>
                <input type="password" id="user-password" name="user_password" required minlength="6" placeholder="Введіть пароль">
            </div>

            <div class="form-group">
                <label for="confirm-password">Підтвердження паролю: *</label>
                <input type="password" id="confirm-password" name="password_confirmation" required placeholder="Повторіть пароль">
            </div>

            <div class="form-group">
                <label for="birth-date">Дата народження:</label>
                <input type="date" id="birth-date" name="birth_date">
            </div>

            <div class="form-group">
                <label for="user-gender">Стать:</label>
                <select id="user-gender" name="user_gender">
                    <option value="" disabled selected>Оберіть стать</option>
                    <option value="male">Чоловіча</option>
                    <option value="female">Жіноча</option>
                    <option value="other">Інше</option>
                </select>
            </div>

            <p class="required-notice">* — поля, обов'язкові для заповнення</p>

            <div class="btn-container">
                <input type="submit" class="btn btn-submit" value="Зареєструватися">
                <input type="reset" class="btn btn-reset" value="Очистити">
            </div>
        </form>
    </main>

    <footer>
        <p><a href="../index.html">← Назад на головну сторінку</a></p>
    </footer>

</body>
</html>
